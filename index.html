    <script>
      // Compatibility shim for extensions or test runners assigning to window.fetch
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var activeFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if environment prevents defining property
        }

        // Prevent external chrome-extension injection failures from breaking application runtime
        window.addEventListener('error', function(event) {
          if (event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
